name: pre-commit

on:
  push:
    branches:
    - main
  pull_request:

jobs:
  pre-commit:
    runs-on: zon-ubuntu-general-dind
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: actions/setup-python@v4
      with:
        python-version: "3.12"
    - uses: pre-commit/action@v3.0.1
