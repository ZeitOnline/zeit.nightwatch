name: Testrunner

on:
  push:
    branches:
    - main
  pull_request:

jobs:
  test:
    name: Test Run
    runs-on: zon-ubuntu-general-dind
    permissions:
      contents: read
      checks: write

    steps:
    - run: |
          sudo apt-get update &&
          wget "https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb" -P /tmp &&
          sudo apt-get install -y "/tmp/google-chrome-stable_current_amd64.deb" -f
    - uses: nanasess/setup-chromedriver@e913548694400f275b4070efcd90f47dbbc8914c # v3.0.0
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.14"
    - name: bin/test
      run: bin/test --junitxml=report.xml

    - name: Publish test result
      uses: enricomi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
      if: always()
      with:
        junit_files: report.xml
        comment_mode: "off"
