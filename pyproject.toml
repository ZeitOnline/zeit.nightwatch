[project]
name = "zeit.nightwatch"
description = "pytest helpers for http smoke tests"
version = "2.4.0.dev0"
requires-python = ">=3.12"
authors = [{ name = "Die ZEIT Online Engineering", email = "zon-backend@zeit.de" }]
dynamic = ["readme"]
dependencies = [
    "cssselect",
    "google-cloud-storage",
    "junit2html",
    "junitparser",
    "lxml",
    "mechanicalsoup",
    "requests",
    "prometheus_client",
    "pytest",
    "pytest-playwright",
]

[dependency-groups]
release = ["towncrier"]

[project.scripts]
gcs-upload = "zeit.nightwatch.gcs:upload"

[project.entry-points.pytest11]
zeit_nightwatch = "zeit.nightwatch.pytest"

[project.urls]
Repository = "https://github.com/ZeitOnline/zeit.nightwatch"


[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"
[tool.hatch.build]
exclude = ["/bin", "/docs"]

[tool.hatch.build.targets.wheel]
packages = ["src/zeit"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/x-rst"
fragments = [{path="README.rst"}, {text="\n\n"}, {path="CHANGES.rst"}]

[tool.pytest.ini_options]
addopts = "--tb=native --browser-channel=chrome"
filterwarnings = [
  "error",
]
pythonpath = [
  "tests",
]

[tool.towncrier]
directory = "docs/changelog/"
filename = "CHANGES.rst"
title_format = ""
# First underline is used for version/date header.
# Second underline is used for the type names (like 'Bug fixes:').
underlines = ["-", "+"]
[[tool.towncrier.type]]
directory = "change"
name = "Changes"  # I'd love to omit the category, but that requires copy&paste of the whole template
showcontent = true


[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
from-first = true
lines-after-imports = 2
