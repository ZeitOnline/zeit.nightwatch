[project]
name = "zeit.nightwatch"
description = "pytest helpers for http smoke tests"
requires-python = ">=3.12"
authors = [{ name = "Die ZEIT Online Engineering", email = "zon-backend@zeit.de" }]
dynamic = ["version"]
readme = "README.rst"
dependencies = [
    "cssselect",
    "google-cloud-storage",
    "junit2html",
    "junitparser",
    "lxml",
    "mechanicalsoup",
    "requests",
    "prometheus_client",
    "pytest",
    "pytest-playwright",
]

[project.scripts]
gcs-upload = "zeit.nightwatch.gcs:upload"

[project.entry-points.pytest11]
zeit_nightwatch = "zeit.nightwatch.pytest"

[project.urls]
Repository = "https://github.com/ZeitOnline/zeit.nightwatch"
Changelog = "https://github.com/ZeitOnline/zeit.nightwatch/blob/main/CHANGES.md"


[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build]
exclude = ["/bin"]

[tool.hatch.build.targets.wheel]
packages = ["src/zeit"]

[tool.pytest.ini_options]
addopts = "--tb=native --browser-channel=chrome"
filterwarnings = [
  "error",
]
pythonpath = [
  "tests",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
from-first = true
lines-after-imports = 2
